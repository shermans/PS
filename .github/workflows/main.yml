name: 合并订阅链接

on:
  # 当推送到 main 分支时触发（你可以改为 master 或其他分支）
  push:
    branches: [ main ]
  # 允许手动在 GitHub Actions 页面触发
  workflow_dispatch:

jobs:
  merge-subscriptions:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'   # 使用 Python 3

      - name: 安装依赖（本脚本无需额外依赖）
        run: |
          python -m pip install --upgrade pip

      - name: 运行合并脚本
        run: python merge_sub.py

      - name: 上传 PS.txt 作为工作产物
        uses: actions/upload-artifact@v4
        with:
          name: merged-subscription   # 产物名称
          path: PS.txt                # 要保存的文件路径
