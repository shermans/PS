name: 合并订阅链接

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  merge-subscriptions:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4  # 保持 v4 或更新到 v4 的最新版，这个警告不影响功能

      - name: 设置 Python 环境
        uses: actions/setup-python@v5  # 保持 v5 或更新到 v5 的最新版，这个警告不影响功能
        with:
          python-version: '3.x'

      - name: 安装依赖（本脚本无需额外依赖）
        run: |
          python -m pip install --upgrade pip

      - name: 运行合并脚本
        run: python merge_sub.py

      - name: 上传 PS.txt 作为工作产物
        uses: actions/upload-artifact@v4  # 保持 v4 或更新到 v4 的最新版
        with:
          name: merged-subscription
          path: PS.txt
