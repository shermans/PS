name: Auto Merge Subscriptions

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动一键触发
  schedule:
    - cron: '0 */6 * * *' # 默认每 6 小时自动运行一次，可根据需要自行调整

jobs:
  run-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写权限，以便自动提交生成的 PS.txt 到仓库
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行合并脚本
        run: python merge_sub.py

      - name: 提交并推送 PS.txt
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add PS.txt
          git commit -m "Auto update PS.txt [skip ci]" || exit 0
          git push
